[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-agent"
version = "0.1.0"
description = "Agentic Governance, Risk & Compliance (GRC) tool for cybersecurity — ingests structured scanner/CSPM/SIEM findings and maps them to NIST/CIS/MITRE ATT&CK controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cyber-GRC" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]

# Dependencies are added incrementally as each deliverable requires them,
# rather than declared up front.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "neo4j>=5.20", # official Bolt driver — spec §7.3
    "requests>=2.32", # HTTP for reference-data APIs — spec §7.8
    "anthropic>=0.40", # Claude via the Anthropic Python SDK — spec's chosen LLM client
    "langgraph>=0.2", # agent orchestration — spec's chosen state-machine framework
    "chromadb>=0.5", # embedded vector store for semantic search — spec §7.4
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["grc_agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["grc_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line length is enforced by black/formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["grc_agent"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# NOTE: this is mypy's *checking* target, not the project's minimum supported
# runtime (still >=3.11, enforced separately by ruff's target-version=py311).
# numpy (a transitive chromadb dependency, pulled in by Deliverable 5's Chroma
# tools) ships .pyi stubs using PEP 695 `type` statements that mypy can only
# parse under python_version >= 3.12; bumping this setting is the documented
# workaround (module-level follow_imports=skip overrides don't prevent mypy
# from still needing to parse the stub file itself).
python_version = "3.12"
files = ["grc_agent"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# Third-party vendor SDKs (pyTenable, neo4j, chromadb, anthropic, etc.) frequently
# ship incomplete or missing type stubs; don't fail the build over that.
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
